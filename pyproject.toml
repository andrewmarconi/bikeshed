[project]
name = "aiswarm"
version = "0.1.0"
description = "A self-organising community of LLM agents"
authors = [
    { name = "Andrew Marconi", email = "andrew@559labs.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "openai>=3.28.0",
    "pydantic>=2.14.0",
    "textual>=8.2.8",
    "typer>=0.27.3",
]

[project.scripts]
aiswarm = "aiswarm.cli:app"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["smoke: needs a live oMLX server or the claude CLI"]
addopts = "-m 'not smoke'"
